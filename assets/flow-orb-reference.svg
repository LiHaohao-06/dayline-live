<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Flow 液态星云光球">
<defs>
  <radialGradient id="glow"><stop stop-color="#7499ff" stop-opacity=".58"/><stop offset=".48" stop-color="#7564ff" stop-opacity=".24"/><stop offset="1" stop-color="#7564ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="sphere" cx="31%" cy="19%" r="82%"><stop stop-color="#f7fbff"/><stop offset=".14" stop-color="#bfd6ff"/><stop offset=".35" stop-color="#79b5ff"/><stop offset=".61" stop-color="#6374f7"/><stop offset=".84" stop-color="#5643c3"/><stop offset="1" stop-color="#1e2b74"/></radialGradient>
  <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#81dcff" stop-opacity=".04"/><stop offset=".27" stop-color="#9ca5ff" stop-opacity=".9"/><stop offset=".58" stop-color="#cf93ff" stop-opacity=".9"/><stop offset=".8" stop-color="#99dfff" stop-opacity=".52"/><stop offset="1" stop-color="#917bff" stop-opacity=".08"/></linearGradient>
  <linearGradient id="sheen" x1=".1" y1=".2" x2=".95" y2=".95"><stop stop-color="#fff" stop-opacity=".85"/><stop offset=".25" stop-color="#b5e8ff" stop-opacity=".15"/><stop offset=".58" stop-color="#b09af9" stop-opacity=".32"/><stop offset="1" stop-color="#d9bfff" stop-opacity=".8"/></linearGradient>
  <linearGradient id="flowGlass" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#e8d6ff" stop-opacity=".64"/><stop offset=".28" stop-color="#8fe4ff" stop-opacity=".3"/><stop offset=".64" stop-color="#7866f4" stop-opacity=".14"/><stop offset="1" stop-color="#ddd5ff" stop-opacity=".67"/></linearGradient>
  <radialGradient id="face"><stop stop-color="#172550"/><stop offset=".7" stop-color="#20287b"/><stop offset="1" stop-color="#36378b"/></radialGradient>
  <radialGradient id="eyes"><stop stop-color="#fff"/><stop offset=".26" stop-color="#e5fbff"/><stop offset=".62" stop-color="#7ad9ff"/><stop offset="1" stop-color="#68a2ff"/></radialGradient>
  <clipPath id="circleClip"><circle cx="128" cy="128" r="73"/></clipPath>
  <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<style><![CDATA[
  .orbital-a { transform-origin:128px 128px; animation:flowOrbitA 26s linear infinite }
  .orbital-b { transform-origin:128px 128px; animation:flowOrbitB 34s linear infinite reverse }
  .inner-fluid { transform-origin:128px 128px; animation:flowFluid 11s ease-in-out infinite alternate }
  .orb-breath { transform-origin:128px 128px; animation:flowBreath 4.5s ease-in-out infinite }
  @keyframes flowOrbitA { to {transform:rotate(360deg)} }
  @keyframes flowOrbitB { to {transform:rotate(360deg)} }
  @keyframes flowFluid { from {transform:rotate(-7deg) scale(.97)} to {transform:rotate(14deg) scale(1.03)} }
  @keyframes flowBreath { 50% { opacity:.82; transform:scale(1.035)} }
  @media (prefers-reduced-motion: reduce) { .orbital-a,.orbital-b,.inner-fluid,.orb-breath {animation:none!important} }
]]></style>
<!-- Outer luminous atmosphere -->
<circle cx="128" cy="128" r="118" fill="url(#glow)" class="orb-breath"/>
<!-- Independent orbit geometry; split from sphere so the front ring reads in depth -->
<g class="orbital-a" fill="none" stroke="url(#orbit)" stroke-width="1.8">
 <ellipse cx="128" cy="128" rx="114" ry="47" transform="rotate(-25 128 128)"/>
 <ellipse cx="128" cy="128" rx="120" ry="53" transform="rotate(-25 128 128)" stroke-opacity=".33"/>
</g>
<g class="orbital-b" fill="none" stroke="url(#orbit)" stroke-width="1.2" stroke-opacity=".56">
 <ellipse cx="128" cy="128" rx="98" ry="68" transform="rotate(37 128 128)"/>
</g>
<!-- Refractive sphere boundary -->
<circle cx="128" cy="128" r="76" fill="#6477ff" opacity=".34" filter="url(#softGlow)"/>
<circle cx="128" cy="128" r="73" fill="url(#sphere)" stroke="#c4d9ff" stroke-opacity=".85" stroke-width="1.4"/>
<g clip-path="url(#circleClip)">
  <g class="inner-fluid">
    <path d="M48 120 C65 64 99 54 125 67 C155 83 160 103 194 104 C218 105 231 132 202 162 C170 194 121 193 96 181 C61 167 44 154 48 120Z" fill="url(#flowGlass)"/>
    <path d="M64 93 C98 55 139 64 149 95 C155 115 173 125 198 126 C182 144 156 154 138 144 C104 123 90 114 64 93Z" fill="#ecddff" opacity=".38"/>
    <path d="M55 149 C79 115 103 140 124 158 C145 175 171 169 204 147 C194 192 164 208 128 203 C89 194 66 178 55 149Z" fill="#4b69e1" opacity=".38"/>
  </g>
  <path d="M68 84 C85 65 118 57 141 64" fill="none" stroke="#fff" stroke-opacity=".82" stroke-width="8" stroke-linecap="round" filter="url(#smallGlow)"/>
  <path d="M72 78 C90 65 115 58 132 64" fill="none" stroke="#fff" stroke-opacity=".64" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 176 C98 205 153 208 179 181" fill="none" stroke="#9cdbff" stroke-opacity=".56" stroke-width="7" filter="url(#smallGlow)"/>
  <!-- Minimal luminous intelligence face, deliberately no mouth -->
  <path d="M90 112 C94 91 162 91 166 112 C168 133 159 155 128 156 C99 155 86 137 90 112Z" fill="url(#face)" opacity=".80"/>
  <ellipse cx="109" cy="125" rx="5.2" ry="9" fill="url(#eyes)"/>
  <ellipse cx="147" cy="125" rx="5.2" ry="9" fill="url(#eyes)"/>
  <ellipse cx="109" cy="125" rx="7" ry="11" fill="#78dfff" opacity=".55" filter="url(#smallGlow)"/>
  <ellipse cx="147" cy="125" rx="7" ry="11" fill="#78dfff" opacity=".55" filter="url(#smallGlow)"/>
  <path d="M58 147 C65 179 91 199 118 201" fill="none" stroke="#a6d1ff" stroke-width="2.4" stroke-opacity=".5"/>
</g>
<!-- Front orbit highlight -->
<path d="M26 155 C78 198 166 156 231 87" fill="none" stroke="url(#orbit)" stroke-width="1.55" stroke-linecap="round" opacity=".85"/>
<circle cx="31" cy="151" r="2.4" fill="#b9dcff"/>
<circle cx="230" cy="90" r="2" fill="#c8aaff"/>
<path d="M128 39l4 12-4 12-4-12z" fill="#88d5ff" opacity=".55"/>
</svg>
